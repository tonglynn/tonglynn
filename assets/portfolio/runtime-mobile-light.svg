<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">MiniClaudeCode</title><desc id="desc">A coding agent, built from the runtime up.</desc><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="600" height="300" rx="12" fill="#f2f4f8"/><text x="36" y="73" font-size="38" fill="#1f2842" font-weight="700" letter-spacing="-1">MiniClaudeCode</text><text x="36" y="124" font-size="24" fill="#5b6682" font-weight="400" >An async Python coding agent.</text><text x="36" y="167" font-size="24" fill="#5b6682" font-weight="400" >Streaming, tools, context, and sessions.</text><text x="36" y="246" font-size="22" fill="#637fb7" font-weight="500" >Runtime / Context / Permissions</text></g></svg>