<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-labelledby="title desc"><title id="title">Attest — MCP memory server</title><desc id="desc">Learns code-review feedback from verified changes; recalls by repository and version; supports human review and retraction. 177 passing tests, 450 preregistered study runs, 60 synthetic attacks. One model, synthetic benchmark; open results include limits and negative findings.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="598" height="758" rx="14" fill="#162337" stroke="#34465e"/><rect x="1" y="1" width="598" height="106" rx="14" fill="#1b3455" stroke="none"/><rect x="1" y="80" width="598" height="27" rx="0" fill="#1b3455" stroke="none"/><text x="32" y="51" font-size="38" font-weight="650" fill="#ffffff">Attest</text><text x="34" y="84" font-size="22" font-weight="400" fill="#c2d3e9">Governed memory for coding agents</text><rect x="440" y="28" width="126" height="38" rx="7" fill="#2b486d" stroke="none"/><text x="455" y="54" font-size="20" font-weight="500" fill="#ffffff">MCP server</text><text x="34" y="155" font-size="31" font-weight="600" fill="#edf3fc">Learn from review.</text><text x="34" y="195" font-size="25" font-weight="400" fill="#aabbd1">Recall in scope. Retract when needed.</text><text x="34" y="247" font-size="23" font-weight="400" fill="#9ac1ff">Evidence gateway  ·  Versioned notes</text><text x="34" y="284" font-size="23" font-weight="400" fill="#9ac1ff">Human approval  ·  Traceable decisions</text><rect x="34" y="322" width="530" height="48" rx="8" fill="#162337" stroke="#34465e"/><text x="50" y="353" font-size="20" font-weight="500" fill="#aabbd1">Review + verified code diff</text><path d="M74 371L74 391" stroke="#34465e" stroke-width="2"/><rect x="34" y="391" width="530" height="48" rx="8" fill="#162337" stroke="#91cdb9"/><text x="50" y="422" font-size="20" font-weight="500" fill="#91cdb9">Evidence gateway</text><path d="M74 440L74 460" stroke="#34465e" stroke-width="2"/><rect x="34" y="460" width="530" height="48" rx="8" fill="#162337" stroke="#34465e"/><text x="50" y="491" font-size="20" font-weight="500" fill="#aabbd1">Scoped recall / human review</text><text x="34" y="592" font-size="36" font-weight="650" fill="#edf3fc">177</text><text x="34" y="626" font-size="21" font-weight="400" fill="#aabbd1">passing tests</text><text x="220" y="592" font-size="36" font-weight="650" fill="#edf3fc">450</text><text x="220" y="626" font-size="21" font-weight="400" fill="#aabbd1">study runs</text><text x="408" y="592" font-size="36" font-weight="650" fill="#edf3fc">60</text><text x="408" y="626" font-size="21" font-weight="400" fill="#aabbd1">attack cases</text><path d="M34 651H566" stroke="#34465e" stroke-width="2"/><text x="34" y="690" font-size="21" font-weight="400" fill="#aabbd1">Preregistered synthetic study; one model.</text><text x="34" y="725" font-size="21" font-weight="400" fill="#aabbd1">Run logs and negative results are public.</text></g></svg>