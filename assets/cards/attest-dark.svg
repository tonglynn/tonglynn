<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Attest — MCP memory server</title><desc id="desc">Learns code-review feedback from verified changes; recalls by repository and version; supports human review and retraction. 177 passing tests, 450 preregistered study runs, 60 synthetic attacks. One model, synthetic benchmark; open results include limits and negative findings.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="998" height="438" rx="14" fill="#162337" stroke="#34465e"/><rect x="1" y="1" width="998" height="106" rx="14" fill="#1b3455" stroke="none"/><rect x="1" y="80" width="998" height="27" rx="0" fill="#1b3455" stroke="none"/><text x="32" y="51" font-size="38" font-weight="650" fill="#ffffff">Attest</text><text x="34" y="84" font-size="22" font-weight="400" fill="#c2d3e9">Governed memory for coding agents</text><rect x="840" y="28" width="126" height="38" rx="7" fill="#2b486d" stroke="none"/><text x="855" y="54" font-size="20" font-weight="500" fill="#ffffff">MCP server</text><text x="34" y="155" font-size="31" font-weight="600" fill="#edf3fc">Learn from review.</text><text x="34" y="195" font-size="25" font-weight="400" fill="#aabbd1">Recall in scope. Retract when needed.</text><text x="34" y="244" font-size="21" font-weight="400" fill="#9ac1ff">Verified changes · Repository + version scope</text><text x="34" y="278" font-size="21" font-weight="400" fill="#9ac1ff">Human decisions · Append-only provenance</text><rect x="636" y="137" width="326" height="48" rx="8" fill="#162337" stroke="#34465e"/><text x="652" y="168" font-size="20" font-weight="500" fill="#aabbd1">Review + verified diff</text><path d="M664 186L664 201" stroke="#34465e" stroke-width="2"/><rect x="636" y="201" width="326" height="48" rx="8" fill="#162337" stroke="#91cdb9"/><text x="652" y="232" font-size="20" font-weight="500" fill="#91cdb9">Evidence gateway</text><path d="M664 250L664 265" stroke="#34465e" stroke-width="2"/><rect x="636" y="265" width="326" height="48" rx="8" fill="#162337" stroke="#34465e"/><text x="652" y="296" font-size="20" font-weight="500" fill="#aabbd1">Scoped recall / review</text><path d="M34 323H966" stroke="#34465e" stroke-width="2"/><text x="34" y="370" font-size="35" font-weight="650" fill="#edf3fc">177</text><text x="119" y="368" font-size="21" font-weight="400" fill="#aabbd1">passing tests</text><text x="282" y="370" font-size="35" font-weight="650" fill="#edf3fc">450</text><text x="367" y="368" font-size="21" font-weight="400" fill="#aabbd1">experiment runs</text><text x="580" y="370" font-size="35" font-weight="650" fill="#edf3fc">60</text><text x="665" y="368" font-size="21" font-weight="400" fill="#aabbd1">synthetic attacks</text><text x="34" y="412" font-size="19" font-weight="400" fill="#aabbd1">Preregistered synthetic study, one model. Open logs, methods, and negative results.</text></g></svg>