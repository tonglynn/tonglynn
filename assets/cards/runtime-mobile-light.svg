<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc"><title id="title">MiniClaudeCode</title><desc id="desc">An async coding-agent runtime. 122 release tests  /  26 contract checks. Windows and Ubuntu CI. One live model task; offline contract checks are evaluator checks, not model success rates.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="598" height="418" rx="14" fill="#ffffff" stroke="#d6e0ed"/><rect x="1" y="1" width="7" height="418" rx="3" fill="#285fa8" stroke="none"/><text x="34" y="57" font-size="34" font-weight="650" fill="#1b304c">MiniClaudeCode</text><text x="34" y="97" font-size="23" font-weight="400" fill="#586b83">An async coding-agent runtime.</text><text x="34" y="145" font-size="22" font-weight="400" fill="#586b83">Deferred tools · Streaming · Permissions</text><text x="34" y="179" font-size="22" font-weight="400" fill="#586b83">Context compression · Resumable sessions</text><rect x="34" y="210" width="240" height="48" rx="8" fill="#ffffff" stroke="#d6e0ed"/><text x="50" y="241" font-size="20" font-weight="500" fill="#586b83">Agent runtime</text><rect x="306" y="210" width="260" height="48" rx="8" fill="#ffffff" stroke="#d6e0ed"/><text x="322" y="241" font-size="20" font-weight="500" fill="#586b83">Session recovery</text><path d="M275 234H306" stroke="#d6e0ed" stroke-width="2"/><path d="M34 291H566" stroke="#d6e0ed" stroke-width="2"/><text x="34" y="332" font-size="23" font-weight="600" fill="#267c63">122 release tests  /  26 contract checks</text><text x="34" y="374" font-size="21" font-weight="400" fill="#586b83">Windows + Ubuntu CI · Live-run evidence</text></g></svg>