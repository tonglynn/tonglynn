<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="252" viewBox="0 0 1000 252" role="img" aria-labelledby="title desc"><title id="title">MiniClaudeCode</title><desc id="desc">An async coding-agent runtime. 122 release tests  /  26 contract checks. Windows and Ubuntu CI. One live model task; offline contract checks are evaluator checks, not model success rates.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="998" height="250" rx="14" fill="#ffffff" stroke="#d6e0ed"/><rect x="1" y="1" width="7" height="250" rx="3" fill="#285fa8" stroke="none"/><text x="34" y="57" font-size="34" font-weight="650" fill="#1b304c">MiniClaudeCode</text><text x="34" y="97" font-size="23" font-weight="400" fill="#586b83">An async coding-agent runtime.</text><text x="34" y="145" font-size="22" font-weight="400" fill="#586b83">Deferred tools · Streaming · Permissions</text><text x="34" y="179" font-size="22" font-weight="400" fill="#586b83">Context compression · Resumable sessions</text><text x="34" y="222" font-size="22" font-weight="600" fill="#267c63">122 release tests  /  26 contract checks</text><rect x="663" y="40" width="300" height="48" rx="8" fill="#ffffff" stroke="#d6e0ed"/><text x="679" y="71" font-size="20" font-weight="500" fill="#586b83">Agent runtime</text><path d="M688 89L688 104" stroke="#d6e0ed" stroke-width="2"/><rect x="663" y="104" width="300" height="48" rx="8" fill="#ffffff" stroke="#d6e0ed"/><text x="679" y="135" font-size="20" font-weight="500" fill="#586b83">Tools + context</text><path d="M688 153L688 168" stroke="#d6e0ed" stroke-width="2"/><rect x="663" y="168" width="300" height="48" rx="8" fill="#ffffff" stroke="#d6e0ed"/><text x="679" y="199" font-size="20" font-weight="500" fill="#586b83">Session recovery</text></g></svg>