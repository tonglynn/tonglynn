<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="252" viewBox="0 0 1000 252" role="img" aria-labelledby="title desc"><title id="title">Audit</title><desc id="desc">Independent evaluation for coding agents. 53 release tests  /  26 contract checks. Windows and Ubuntu CI. One live model task; offline contract checks are evaluator checks, not model success rates.</desc><g font-family="Segoe UI, Arial, sans-serif"><rect x="1" y="1" width="998" height="250" rx="14" fill="#162337" stroke="#34465e"/><rect x="1" y="1" width="7" height="250" rx="3" fill="#91cdb9" stroke="none"/><text x="34" y="57" font-size="34" font-weight="650" fill="#edf3fc">Audit</text><text x="34" y="97" font-size="23" font-weight="400" fill="#aabbd1">Independent evaluation for coding agents.</text><text x="34" y="145" font-size="22" font-weight="400" fill="#aabbd1">Task contracts · Fresh fixtures · Failure traces</text><text x="34" y="179" font-size="22" font-weight="400" fill="#aabbd1">Final-code checks separate from the agent</text><text x="34" y="222" font-size="22" font-weight="600" fill="#91cdb9">53 release tests  /  26 contract checks</text><rect x="663" y="40" width="300" height="48" rx="8" fill="#162337" stroke="#34465e"/><text x="679" y="71" font-size="20" font-weight="500" fill="#aabbd1">Task + agent</text><path d="M688 89L688 104" stroke="#34465e" stroke-width="2"/><rect x="663" y="104" width="300" height="48" rx="8" fill="#162337" stroke="#34465e"/><text x="679" y="135" font-size="20" font-weight="500" fill="#aabbd1">Independent verifier</text><path d="M688 153L688 168" stroke="#34465e" stroke-width="2"/><rect x="663" y="168" width="300" height="48" rx="8" fill="#162337" stroke="#34465e"/><text x="679" y="199" font-size="20" font-weight="500" fill="#aabbd1">Outcome + trace</text></g></svg>